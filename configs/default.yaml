model:
  Lx: 8
  Ly: 8
  rho: 0.15

observation:
  # all_safe または bernoulli_safe
  protocol: bernoulli_safe
  observation_rate: 0.5

seeds:
  instance: 12345
  observation: 23456

exact:
  # 全列挙の誤実行を防ぐ明示的な上限
  max_variables: 20
  chunk_size: 65536

bp:
  max_iterations: 1000
  tolerance: 1.0e-10
  # old messageを保持する割合
  damping: 0.2
  initialization: prior
  seed: 34567

mcmc:
  sampler: local_bfs_blocked_gibbs
  block_size: 4
  burn_in: 1000
  samples: 5000
  thinning: 1
  # 複数chainではchainごとに別seedを指定する
  seeds: [45678, 56789, 67890, 78901]
