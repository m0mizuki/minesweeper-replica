<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BP Minesweeper</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="intro">
        <p class="eyebrow">BELIEF PROPAGATION LAB</p>
        <h1>Minesweeper <span>× BP</span></h1>
        <p>各マスを独立な Bernoulli(<i>ρ</i>) で生成。開示した数字だけを使って、BP が地雷確率を推定します。</p>
      </header>

      <section class="workspace" aria-label="BP Minesweeper">
        <div class="game-card">
          <div class="top-panel">
            <div class="metric"><span>FLAGS</span><strong id="flag-counter">000</strong></div>
            <button class="face" id="new-game" type="button" aria-label="新しいゲーム">
              <span class="eyes"></span><span class="mouth"></span>
            </button>
            <div class="metric right"><span>TIME</span><strong id="timer">000</strong></div>
          </div>
          <div class="board-frame">
            <div class="board" id="board" role="grid" aria-label="マインスイーパー盤面"></div>
          </div>
          <p class="controls-hint">左クリック: 開く　右クリック: フラグ　数字を再クリック: 周囲を開く</p>
        </div>

        <aside class="lab-panel">
          <div class="lab-heading">
            <div><span class="pulse"></span>BP PREDICTOR</div>
            <span id="bp-state" class="state">READY</span>
          </div>

          <label for="rho">地雷密度 <i>ρ</i><output id="rho-value">0.123</output></label>
          <input id="rho" type="range" min="0.01" max="0.60" step="0.001" value="0.123" />
          <p class="microcopy">総地雷数は固定せず、各セルを独立に生成します。</p>

          <label for="size">盤面サイズ</label>
          <select id="size">
            <option value="6">6 × 6</option>
            <option value="9" selected>9 × 9</option>
            <option value="12">12 × 12</option>
            <option value="16">16 × 16</option>
          </select>

          <button class="primary" id="solve-bp" type="button">
            <span>BPで地雷を予想</span><small>SUM-PRODUCT</small>
          </button>

          <dl class="diagnostics">
            <div><dt>STATUS</dt><dd id="diag-status">—</dd></div>
            <div><dt>ITERATIONS</dt><dd id="diag-iterations">—</dd></div>
            <div><dt>RESIDUAL</dt><dd id="diag-residual">—</dd></div>
            <div><dt>FACTORS</dt><dd id="diag-factors">—</dd></div>
          </dl>

          <div class="legend">
            <span><i class="swatch low"></i>安全寄り</span>
            <span><i class="swatch high"></i>地雷寄り</span>
          </div>
          <p id="message" class="message" aria-live="polite"></p>
        </aside>
      </section>
    </main>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
