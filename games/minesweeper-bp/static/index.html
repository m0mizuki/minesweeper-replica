<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minesweeper</title>
    <link rel="stylesheet" href="/static/styles.css?v=5" />
  </head>
  <body>
    <main class="shell" aria-label="マインスイーパー">
      <section class="game" aria-live="polite">
        <div class="top-panel">
          <div class="counter" id="flag-counter" aria-label="フラグ数">000</div>
          <button class="face" id="new-game" type="button" aria-label="新しいゲーム">
            <span class="eyes"></span>
            <span class="mouth"></span>
          </button>
          <div class="counter" id="timer" aria-label="経過秒数">000</div>
        </div>
        <div class="board-frame">
          <div class="board" id="board" role="grid" aria-label="9 × 9 マインスイーパー盤面"></div>
        </div>
        <div class="rho-panel">
          <label for="rho">盤面生成の地雷確率 ρ</label>
          <input id="rho" type="range" min="0.01" max="0.60" step="0.001" value="0.123" />
          <output id="rho-value" for="rho">0.123</output>
        </div>
        <div class="bp-panel">
          <button class="bp-button" id="solve-bp" type="button">BPで予想</button>
          <span class="bp-status" id="bp-status" aria-live="polite"></span>
        </div>
      </section>
    </main>
    <script src="/static/app.js?v=5" type="module"></script>
  </body>
</html>
